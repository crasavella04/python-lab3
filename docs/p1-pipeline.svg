<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" width="900" height="360" font-family="-apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="13">
  <rect width="900" height="360" fill="#ffffff"/>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a5568"/>
    </marker>
  </defs>

  <!-- События -->
  <rect x="16" y="40" width="170" height="250" rx="8" fill="#f4f6fb" stroke="#9aa5b8"/>
  <text x="101" y="64" text-anchor="middle" font-weight="700" fill="#1a202c">События</text>
  <text x="30" y="96" fill="#1a202c">push в main</text>
  <text x="30" y="126" fill="#1a202c">push в другую ветку</text>
  <text x="30" y="156" fill="#1a202c">pull_request → main</text>
  <text x="30" y="186" fill="#1a202c">workflow_dispatch</text>
  <text x="30" y="216" fill="#1a202c">schedule</text>
  <text x="30" y="232" fill="#4a5568" font-size="11">пн 06:00 UTC</text>

  <line x1="186" y1="165" x2="226" y2="165" stroke="#4a5568" stroke-width="1.6" marker-end="url(#arr)"/>

  <!-- lint -->
  <rect x="228" y="40" width="200" height="250" rx="8" fill="#eef4ff" stroke="#3f63c8"/>
  <text x="328" y="64" text-anchor="middle" font-weight="700" fill="#1f3c88">lint</text>
  <text x="242" y="92" fill="#1a202c">checkout (вся история)</text>
  <text x="242" y="114" fill="#1a202c">Python 3.14.7</text>
  <text x="242" y="136" fill="#1a202c">кэш pip → pip install</text>
  <text x="242" y="150" fill="#4a5568" font-size="11">--require-hashes</text>
  <text x="242" y="172" fill="#1a202c">маскирование секрета</text>
  <text x="242" y="194" fill="#1a202c">манифест T2</text>
  <text x="242" y="216" fill="#1a202c">sphinx-build -W</text>
  <text x="242" y="238" fill="#1a202c">орфография</text>
  <text x="242" y="260" fill="#1a202c">внешние ссылки</text>
  <text x="328" y="282" text-anchor="middle" fill="#4a5568" font-size="11">все события</text>

  <line x1="428" y1="165" x2="468" y2="165" stroke="#4a5568" stroke-width="1.6" marker-end="url(#arr)"/>
  <text x="448" y="155" text-anchor="middle" fill="#4a5568" font-size="11">needs</text>

  <!-- build -->
  <rect x="470" y="40" width="190" height="250" rx="8" fill="#eef8f1" stroke="#2f8f57"/>
  <text x="565" y="64" text-anchor="middle" font-weight="700" fill="#1e6b3f">build</text>
  <text x="484" y="92" fill="#1a202c">checkout, Python,</text>
  <text x="484" y="110" fill="#1a202c">кэш pip, pip install</text>
  <text x="484" y="136" fill="#1a202c">sphinx-build -W</text>
  <text x="484" y="152" fill="#4a5568" font-size="11">SITE_URL = PAGES_URL</text>
  <text x="484" y="178" fill="#1a202c">upload-pages-artifact</text>
  <rect x="484" y="196" width="162" height="44" rx="6" fill="#ffffff" stroke="#2f8f57" stroke-dasharray="4 3"/>
  <text x="565" y="214" text-anchor="middle" fill="#1e6b3f" font-size="12">артефакт github-pages</text>
  <text x="565" y="230" text-anchor="middle" fill="#4a5568" font-size="11">site/, хранится 1 день</text>
  <text x="565" y="282" text-anchor="middle" fill="#4a5568" font-size="11">все события</text>

  <line x1="660" y1="165" x2="700" y2="165" stroke="#4a5568" stroke-width="1.6" marker-end="url(#arr)"/>
  <text x="680" y="155" text-anchor="middle" fill="#4a5568" font-size="11">needs</text>

  <!-- deploy -->
  <rect x="702" y="40" width="182" height="250" rx="8" fill="#fff6e8" stroke="#c77d12"/>
  <text x="793" y="64" text-anchor="middle" font-weight="700" fill="#8a5300">deploy</text>
  <text x="716" y="92" fill="#1a202c">deploy-pages</text>
  <text x="716" y="110" fill="#4a5568" font-size="11">→ GitVerse Pages</text>
  <text x="716" y="136" fill="#1a202c">check_site.py:</text>
  <text x="716" y="154" fill="#4a5568" font-size="11">HTTP, build-marker,</text>
  <text x="716" y="170" fill="#4a5568" font-size="11">поиск, KaTeX, без CDN</text>
  <text x="793" y="264" text-anchor="middle" fill="#8a5300" font-size="12" font-weight="700">только main</text>
  <text x="793" y="282" text-anchor="middle" fill="#4a5568" font-size="11">push или ручной запуск</text>

  <text x="450" y="330" text-anchor="middle" fill="#4a5568" font-size="12">Ошибка на любой стадии останавливает следующие: needs выполняет job только после успеха предыдущего</text>
</svg>

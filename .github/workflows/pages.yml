name: Build and deploy

on:
  push:
    # main — на GitHub Pages и в корень Helios; остальные ветки — preview на Helios (P4)
    branches: ["**"]
    # P5: тег версии (git tag v1.1 && git push --tags) публикует её в vX.Y/ и переводит на неё latest
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: "P5: выпущенная версия (тег) — проверить, что она опубликована и стала latest"
        required: false
        default: ""

permissions:
  contents: read

# Одновременно идёт только один деплой; уже запущенный не прерываем.
# Тег публикует тот же сайт, что и main (корень — main, версии — из тегов), поэтому очередь общая
concurrency:
  group: deploy-${{ github.ref_type == 'tag' && 'refs/heads/main' || github.ref }}
  cancel-in-progress: false

env:
  PYTHON_VERSION: "3.14"

jobs:
  # ---------- Выпуск версии по тегу (P5) ----------
  # git tag v1.1 && git push --tags. Публиковать прямо из запуска по тегу нельзя: окружение
  # github-pages по умолчанию пускает только main («Tag "v1.0" is not allowed to deploy to
  # github-pages due to environment protection rules» — так и случилось с v1.0). Поэтому запуск по
  # тегу проверяет имя тега и запускает этот же workflow на main с version=<тег>: тот собирает
  # корень из main и все теги в vX.Y/, выкладывает на Pages и Helios и проверяет, что версия
  # опубликована и стала latest. GITHUB_TOKEN может порождать запуски workflow_dispatch.
  release-tag:
    if: github.ref_type == 'tag' && github.server_url == 'https://github.com'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Dispatch build and deploy from main
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          case "$TAG" in
            v[0-9]*.[0-9]*) ;;
            *) echo "::error::тег версии — vX.Y, получено $TAG"; exit 1 ;;
          esac
          gh workflow run pages.yml --repo "$GITHUB_REPOSITORY" --ref main -f version="$TAG"
          echo "::notice title=Выпуск $TAG::запущена сборка и выкладка из main с проверкой версии $TAG"

  # ---------- GitHub Pages ----------
  build-pages:
    # GitVerse тоже читает .github/workflows/; там этот workflow не нужен (у GitVerse свой — .gitverse/).
    # Ветки, кроме main, на Pages не публикуются: у репозитория один сайт Pages, preview — на Helios
    if: github.server_url == 'https://github.com' && (github.event_name == 'pull_request' || github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    outputs:
      commit: ${{ steps.commit.outputs.commit }}
    env:
      SITE_URL: https://crasavella04.github.io/python-lab3/
      DEPLOY_TARGET: github-pages
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          # Даты страниц берутся из истории Git, версии P5 — из всех тегов: нужна полная история
          fetch-depth: 0
      - id: commit
        name: Commit of the root build
        # Коммит корня сайта — для контрольной строки и проверки после выкладки
        run: |
          echo "SITE_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: pip install --require-hashes -r requirements.txt
      - name: Check T2 results provenance
        # Результаты T2 считаются вне CI; здесь только проверяем, что они соответствуют коду и данным
        run: python research/t2/provenance.py check docs/t2/results
      - name: P3 results cache
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: .cache/p3
          key: p3-${{ hashFiles('research/p3/data/**', 'research/p3/pipeline.py') }}
          restore-keys: p3-
      - name: Build site (P3 results → strict Sphinx build → versions → spelling)
        # nox -s site: research/p3/pipeline.py (кэш) → sphinx-build -W → версии по тегам → орфография
        run: python -m nox -s site
      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4.0.0
        with:
          path: site

  deploy-pages:
    # В PR только проверяем сборку, публикуем лишь из main (выпуск по тегу — тоже из main, см. release-tag)
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && github.server_url == 'https://github.com'
    needs: build-pages
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
      - name: Verify deployed site
        env:
          SITE_COMMIT: ${{ needs.build-pages.outputs.commit }}
        run: python scripts/check_site.py "${{ steps.deployment.outputs.page_url }}" --commit "$SITE_COMMIT" --target github-pages ${{ inputs.version && format('--version {0}', inputs.version) || '' }}

  # ---------- Helios ИТМО (P4) ----------
  # main → корень сайта, остальные ветки → preview/<имя>/. Выкладка релизами (scripts/helios_deploy.sh):
  # архив целиком принимается во временный каталог, затем каталоги меняются местами, прежняя версия
  # сохраняется. После выкладки — healthcheck; не прошёл → автоматический откат и красный job.
  # Ручной откат и удаление preview — .github/workflows/helios-admin.yml.
  # Настройки: variables HELIOS_HOST, HELIOS_PORT, HELIOS_USER, HELIOS_URL; secret HELIOS_SSH_KEY
  # (отдельный ключ только для деплоя). Пока переменные не заданы, job пропускается.
  deploy-helios:
    if: >-
      github.event_name != 'pull_request' && github.ref_type != 'tag' &&
      vars.HELIOS_USER != '' && github.server_url == 'https://github.com'
    runs-on: ubuntu-latest
    # Выкладки на Helios идут строго по очереди: корень и preview живут в одном каталоге
    concurrency:
      group: helios
      cancel-in-progress: false
    environment:
      name: ${{ github.ref == 'refs/heads/main' && 'helios' || 'helios-preview' }}
      url: ${{ steps.target.outputs.url }}
    steps:
      - name: Target (root or preview)
        id: target
        env:
          BRANCH: ${{ github.ref_name }}
          HELIOS_URL: ${{ vars.HELIOS_URL }}
        run: |
          base="${HELIOS_URL%/}"
          if [ "$BRANCH" = main ]; then
            target=root; url="$base/"; deploy_target=helios
          else
            # Имя каталога из имени ветки: feature/New_X → feature-new-x (то же правило — в helios-admin.yml)
            slug=$(printf '%s' "$BRANCH" | tr 'A-Z' 'a-z' | sed 's/[^a-z0-9]/-/g; s/--*/-/g; s/^-//' | cut -c1-40 | sed 's/-$//')
            [ -n "$slug" ] || { echo "::error::из имени ветки не получилось имя каталога"; exit 1; }
            target="preview/$slug"; url="$base/preview/$slug/"; deploy_target=helios-preview
            echo "SITE_PREVIEW=$slug" >> "$GITHUB_ENV"
          fi
          { echo "SITE_URL=$url"; echo "DEPLOY_TARGET=$deploy_target"; echo "TARGET=$target"; } >> "$GITHUB_ENV"
          { echo "target=$target"; echo "url=$url"; } >> "$GITHUB_OUTPUT"
          echo "Ветка $BRANCH → $target → $url"

      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0   # даты из истории Git; версии P5 — из всех тегов
      - name: Commit of the root build
        run: echo "SITE_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: pip install --require-hashes -r requirements.txt
      - name: Check T2 results provenance
        # Результаты T2 считаются вне CI; здесь только проверяем, что они соответствуют коду и данным
        run: python research/t2/provenance.py check docs/t2/results
      - name: P3 results cache
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: .cache/p3
          key: p3-${{ hashFiles('research/p3/data/**', 'research/p3/pipeline.py') }}
          restore-keys: p3-
      - name: Build site (P3 results → strict Sphinx build)
        run: python -m nox -s build

      # .htaccess не кладём: Apache на Helios не разрешает в нём Options/ErrorDocument
      # и отвечает 500 на весь каталог. Несуществующие страницы получают стандартный 404 сервера.

      - name: Fault injection (P4 demo, preview only)
        # Демонстрация отказов: метка [p4-fault: …] в сообщении коммита ветки (в main не действует).
        #   drop-asset — в сборке нет katex.min.js: выкладка проходит, healthcheck — нет → откат
        #   interrupt  — передача архива обрывается на середине
        if: github.ref != 'refs/heads/main'
        env:
          MSG: ${{ github.event.head_commit.message }}
        run: |
          fault=$(printf '%s' "$MSG" | sed -n 's/.*\[p4-fault: *\([a-z-]*\)\].*/\1/p' | head -n 1)
          case "$fault" in
            '') echo "Сбоев не заказано"; exit 0 ;;
            drop-asset) rm site/_static/katex/katex.min.js; echo "::warning::Сбой: из сборки удалён _static/katex/katex.min.js" ;;
            interrupt) echo "::warning::Сбой: передача архива будет оборвана на середине" ;;
            *) echo "::error::неизвестный сбой: $fault"; exit 1 ;;
          esac
          echo "FAULT=$fault" >> "$GITHUB_ENV"

      - name: SSH to Helios
        id: ssh
        uses: ./.github/actions/helios-ssh
        with:
          key: ${{ secrets.HELIOS_SSH_KEY }}
          host: ${{ vars.HELIOS_HOST }}
          port: ${{ vars.HELIOS_PORT }}
          user: ${{ vars.HELIOS_USER }}
          forced-command: ${{ vars.HELIOS_FORCED_COMMAND }}

      - name: Upload to Helios
        id: upload
        run: |
          tar -C site -czf "$RUNNER_TEMP/site.tgz" .
          size=$(stat -c %s "$RUNNER_TEMP/site.tgz")
          echo "Архив: $((size / 1024)) КБ"
          # Вывод скрипта на сервере — ещё и аннотацией: её видно на странице запуска без лога
          log="$RUNNER_TEMP/deploy.log"
          annotate() { echo "::$1 title=$2::$(awk 'BEGIN { ORS = "%0A" } { gsub(/%/, "%25"); print }' "$log")"; }
          start=$(date +%s%N)
          rc=0
          if [ "${FAULT:-}" = interrupt ]; then
            # Половина архива, затем ssh-клиент убит — как при потере сети или отмене job
            { head -c $((size / 2)) "$RUNNER_TEMP/site.tgz"; sleep 30; } |
              timeout 10 ssh helios "$HELIOS_DEPLOY deploy $TARGET $SITE_COMMIT" > "$log" 2>&1 || rc=$?
          else
            ssh helios "$HELIOS_DEPLOY deploy $TARGET $SITE_COMMIT" < "$RUNNER_TEMP/site.tgz" > "$log" 2>&1 || rc=$?
          fi
          ms=$(( ($(date +%s%N) - start) / 1000000 ))
          echo "код $rc, $ms мс, архив $((size / 1024)) КБ" >> "$log"
          cat "$log"
          echo "Выкладка на Helios ($TARGET): код $rc, $ms мс, архив $((size / 1024)) КБ" >> "$GITHUB_STEP_SUMMARY"
          if [ "$rc" = 0 ]; then annotate notice "Выкладка $TARGET"; else annotate error "Выкладка $TARGET не удалась"; fi
          exit "$rc"

      - name: Healthcheck
        id: health
        # HTTP 200 и контрольная строка <meta name="build-marker"> с коммитом этой сборки (+ ресурсы, поиск)
        run: python scripts/check_site.py "$SITE_URL" --commit "$SITE_COMMIT" --target "$DEPLOY_TARGET" ${{ inputs.version && format('--version {0}', inputs.version) || '' }}

      - name: Roll back after failed healthcheck
        if: failure() && steps.health.outcome == 'failure'
        run: |
          echo "::error::Healthcheck не прошёл — возвращаю предыдущий релиз"
          ssh helios "$HELIOS_DEPLOY rollback $TARGET failed" > "$RUNNER_TEMP/rollback.txt" 2>&1
          cat "$RUNNER_TEMP/rollback.txt"
          echo "::warning title=Автооткат $TARGET::$(awk 'BEGIN { ORS = "%0A" } { print }' "$RUNNER_TEMP/rollback.txt")"
          commit=$(sed -n 's/.*commit=\([0-9a-f]*\).*/\1/p' "$RUNNER_TEMP/rollback.txt")
          python scripts/check_site.py "$SITE_URL" ${commit:+--commit "$commit"}

      - name: Live version after interrupted upload
        # Оборванная выкладка не должна была тронуть рабочую версию — проверяем
        if: failure() && steps.upload.outcome == 'failure'
        run: python scripts/check_site.py "$SITE_URL"

      - name: Releases on Helios
        if: always() && steps.ssh.outcome == 'success'
        run: |
          ssh helios "$HELIOS_DEPLOY list $TARGET" | tee "$RUNNER_TEMP/list.txt"
          echo "::notice title=Релизы на Helios::$(awk 'BEGIN { ORS = "%0A" } { print }' "$RUNNER_TEMP/list.txt")"

  # ---------- Файловое хранилище на Helios (челлендж) ----------
  # Наборы данных публикуются отдельно от сайта, в public_html/python-lab3-data/, собственным
  # action «Upload to Helios ITMO» — https://github.com/crasavella04/helios-upload-action.
  # Закреплён по SHA, как и остальные action (T4); тег v1 у него подвижный.
  publish-data:
    if: >-
      github.event_name != 'pull_request' && github.ref == 'refs/heads/main' &&
      vars.HELIOS_USER != '' && github.server_url == 'https://github.com'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: Build data package
        run: python3 scripts/data_package.py data-package
      - id: upload
        uses: crasavella04/helios-upload-action@0b9ce27cd15b7f702f756d915cd7b10b38242688 # v1.0.0
        with:
          username: ${{ vars.HELIOS_USER }}
          key: ${{ secrets.HELIOS_SSH_KEY }}
          source: data-package
          destination: public_html/python-lab3-data
          delete: "true"
      - name: Verify published files against SHA256SUMS
        env:
          URL: ${{ steps.upload.outputs.url }}
          METHOD: ${{ steps.upload.outputs.method }}
          FILES: ${{ steps.upload.outputs.files }}
          MS: ${{ steps.upload.outputs.duration-ms }}
        run: |
          echo "url=$URL method=$METHOD files=$FILES duration=${MS} ms"
          test -n "$URL"
          mkdir check && cd check
          curl --fail --silent --show-error "${URL}SHA256SUMS" -o SHA256SUMS
          cut -d' ' -f3 SHA256SUMS | while read -r f; do
            mkdir -p "$(dirname "$f")"
            curl --fail --silent --show-error "$URL$f" -o "$f"
          done
          sha256sum -c SHA256SUMS
          curl --fail --silent "$URL" | grep -q 'Данные исследований python-lab3'
          echo "::notice title=Данные на Helios::$FILES файлов, $METHOD, $MS мс — $URL"

name: Helios rollback and cleanup

# P4: управление выложенными версиями на Helios (сама выкладка — в pages.yml).
#   Откат вручную:  Actions → «Helios rollback and cleanup» → Run workflow (action=rollback,
#                   target=root или preview/<имя>, release — пусто для предыдущего релиза)
#              или: git tag rollback/root/<любое> && git push origin rollback/root/<любое>
#                   (rollback/preview/<имя>/<любое> — откат preview). Тег остаётся записью в истории.
#   Удалили ветку → удаляется её preview.
on:
  workflow_dispatch:
    inputs:
      action:
        type: choice
        options: [rollback, list, remove]
        default: rollback
      target:
        description: root или preview/<имя>
        default: root
      release:
        description: имя релиза (пусто — предыдущий; список — action=list)
        required: false
  push:
    tags: ["rollback/**"]
  delete:

permissions:
  contents: read

jobs:
  helios:
    if: >-
      github.server_url == 'https://github.com' && vars.HELIOS_USER != '' &&
      (github.event_name != 'delete' || github.event.ref_type == 'branch')
    runs-on: ubuntu-latest
    # Та же очередь, что у выкладки: откат не пересечётся с деплоем
    concurrency:
      group: helios
      cancel-in-progress: false
    steps:
      - name: Command
        id: cmd
        env:
          EVENT: ${{ github.event_name }}
          IN_ACTION: ${{ inputs.action }}
          IN_TARGET: ${{ inputs.target }}
          IN_RELEASE: ${{ inputs.release }}
          REF: ${{ github.ref }}
          DELETED: ${{ github.event.ref }}
          HELIOS_URL: ${{ vars.HELIOS_URL }}
        run: |
          # то же правило имени, что в pages.yml
          slug() { printf '%s' "$1" | tr 'A-Z' 'a-z' | sed 's/[^a-z0-9]/-/g; s/--*/-/g; s/^-//' | cut -c1-40 | sed 's/-$//'; }
          case "$EVENT" in
            workflow_dispatch) action=$IN_ACTION; target=$IN_TARGET; release=$IN_RELEASE ;;
            push) t=${REF#refs/tags/rollback/}; action=rollback; target=${t%/*}; release= ;;
            delete) action=remove; target="preview/$(slug "$DELETED")"; release= ;;
          esac
          # Значения уходят в командную строку на сервере — пропускаем только безопасные символы
          case "$target" in
            root) ;;
            preview/*) n=${target#preview/}; case "$n" in ''|*[!a-z0-9-]*) echo "::error::цель: $target"; exit 1;; esac ;;
            *) echo "::error::цель: root или preview/<имя>, получено «$target»"; exit 1 ;;
          esac
          case "$release" in *[!0-9A-Za-z-]*) echo "::error::имя релиза: $release"; exit 1;; esac
          url="${HELIOS_URL%/}/"; [ "$target" = root ] || url="$url$target/"
          { echo "ACTION=$action"; echo "TARGET=$target"; echo "RELEASE=$release"; echo "SITE_URL=$url"; } >> "$GITHUB_ENV"
          echo "$action $target $release → $url"

      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: SSH to Helios
        uses: ./.github/actions/helios-ssh
        with:
          key: ${{ secrets.HELIOS_SSH_KEY }}
          host: ${{ vars.HELIOS_HOST }}
          port: ${{ vars.HELIOS_PORT }}
          user: ${{ vars.HELIOS_USER }}
          forced-command: ${{ vars.HELIOS_FORCED_COMMAND }}

      - name: Run on Helios
        run: |
          ssh helios "$HELIOS_DEPLOY list $TARGET" || true
          start=$(date +%s%N)
          ssh helios "$HELIOS_DEPLOY $ACTION $TARGET $RELEASE" | tee "$RUNNER_TEMP/out.txt"
          echo "$ACTION $TARGET: $(( ($(date +%s%N) - start) / 1000000 )) мс" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Healthcheck after rollback
        if: env.ACTION == 'rollback'
        run: |
          commit=$(sed -n 's/.*commit=\([0-9a-f]*\).*/\1/p' "$RUNNER_TEMP/out.txt")
          python3 scripts/check_site.py "$SITE_URL" ${commit:+--commit "$commit"}

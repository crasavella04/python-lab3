name: Test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # upload.sh against a throwaway sshd on the runner: rsync and tar, with and without delete,
  # rejected destinations and host keys. No secrets — the server is local.
  e2e:
    strategy:
      matrix:
        os: [ubuntu-24.04, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - run: bash tests/e2e.sh

  # The action itself (action.yml wiring, inputs, outputs) via `uses: ./`
  action:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: Start a local sshd
        run: bash tests/sshd.sh --github-env
      - name: Prepare a site
        run: |
          mkdir -p demo/sub
          echo '<h1>hello</h1>' > demo/index.html
          echo 'b' > demo/sub/b.txt
      - id: first
        uses: ./
        with:
          host: 127.0.0.1
          port: "2222"
          username: runner
          key: ${{ env.TEST_KEY }}
          known-hosts: ${{ env.TEST_KNOWN_HOSTS }}
          source: demo
          destination: public_html/demo
      - name: Check first upload
        env:
          METHOD: ${{ steps.first.outputs.method }}
          FILES: ${{ steps.first.outputs.files }}
        run: |
          test -f ~/public_html/demo/index.html
          test "$METHOD" = rsync
          test "$FILES" = 2
      - run: rm demo/sub/b.txt
      - id: second
        uses: ./
        with:
          host: 127.0.0.1
          port: "2222"
          username: runner
          key: ${{ env.TEST_KEY }}
          known-hosts: ${{ env.TEST_KNOWN_HOSTS }}
          source: demo
          destination: public_html/demo
          method: tar
          delete: "true"
      - name: Check delete with tar
        env:
          METHOD: ${{ steps.second.outputs.method }}
        run: |
          test "$METHOD" = tar
          test -f ~/public_html/demo/index.html
          test ! -e ~/public_html/demo/sub/b.txt
      - id: unsafe
        uses: ./
        continue-on-error: true
        with:
          host: 127.0.0.1
          port: "2222"
          username: runner
          key: ${{ env.TEST_KEY }}
          known-hosts: ${{ env.TEST_KNOWN_HOSTS }}
          source: demo
          destination: ../outside
      - name: Unsafe destination must fail
        run: test "${{ steps.unsafe.outcome }}" = failure

  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - run: shellcheck --severity=warning upload.sh tests/*.sh

site_name: Результаты исследований
site_description: Отчёты по теоретическому и практическому заданиям курса РРиИД Python
# Адрес зависит от площадки: в CI передаётся через SITE_URL (GitHub Pages / Helios)
site_url: !ENV [SITE_URL, 'https://crasavella04.github.io/python-lab3/']
repo_url: https://github.com/crasavella04/python-lab3
repo_name: crasavella04/python-lab3
edit_uri: edit/main/docs/
copyright: >
  Тексты — <a href="https://creativecommons.org/licenses/by/4.0/deed.ru">CC BY 4.0</a>,
  код — <a href="https://github.com/crasavella04/python-lab3/blob/main/LICENSE">MIT</a>
docs_dir: docs
site_dir: site
# Ссылки вида about/ вместо about.html; MkDocs делает их относительными,
# поэтому сайт работает в любом подкаталоге (/python-lab3/, /~login/...)
use_directory_urls: true
# Сгенерированные фрагменты T2 вставляются в страницу через snippets, отдельными страницами не собираются
exclude_docs: |
  t2/results/*.md

theme:
  name: material
  custom_dir: overrides
  # Не грузить Roboto с Google Fonts: сайт не должен зависеть от внешних CDN
  font: false
  language: ru
  features:
    - navigation.instant
    - navigation.sections
    - navigation.top
    - search.highlight
    - content.code.copy
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      toggle:
        icon: material/brightness-7
        name: Тёмная тема
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      toggle:
        icon: material/brightness-4
        name: Светлая тема

nav:
  - Главная: index.md
  - Исследования:
      - T1. Сравнение генераторов: t1.md
      - T2. Конвейер вычислений: t2/index.md
      - T3. Отечественные CI/CD и хостинги: t3.md
      - T4. Доставка и безопасность: t4.md
      - T5. Публикуемость и цитируемость: t5.md
  - Практическое задание: practice.md
  - О сайте: about.md
  - Отладка: debugging.md
  - Лицензии: license.md

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
      # Якоря из текста заголовка с кириллицей (#методика), а не порядковые (#_1):
      # порядковые сдвигаются при добавлении раздела и ломают внешние ссылки
      slugify: !!python/object/apply:pymdownx.slugs.slugify
        kwds:
          case: lower
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.snippets:
      base_path: [docs]
      check_paths: true
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.arithmatex:
      generic: true

extra:
  build:
    commit: !ENV [GITHUB_SHA, local]
    target: !ENV [DEPLOY_TARGET, local]
  # Метаданные для цитирования и индексации (overrides/partials/metadata.html).
  # Страница считается публикацией, если в её front matter есть date.
  citation:
    authors:
      - name: crasavella04      # заменить на ФИО
        orcid: ""               # 0000-0000-0000-0000, если есть
    institution: Университет ИТМО
    doi: ""                     # DOI архива в Zenodo, после выпуска релиза
    repository: https://github.com/crasavella04/python-lab3
    license:
      text: https://creativecommons.org/licenses/by/4.0/
      code: https://opensource.org/license/mit
      data: https://creativecommons.org/publicdomain/zero/1.0/

extra_javascript:
  - assets/katex/katex.min.js
  - assets/katex/auto-render.min.js
  - javascripts/katex-init.js

extra_css:
  - assets/katex/katex.min.css

validation:
  nav:
    omitted_files: warn
    not_found: warn
  links:
    not_found: warn
    anchors: warn
